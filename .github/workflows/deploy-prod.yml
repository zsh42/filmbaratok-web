name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            zsoltfiddler/filmbaratok:web-latest
            zsoltfiddler/filmbaratok:web-prod
            zsoltfiddler/filmbaratok:web-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify deploy
        if: ${{ secrets.COOLIFY_PROD_WEBHOOK_WEB != '' }}
        run: |
          curl --fail -X GET "${{ secrets.COOLIFY_PROD_WEBHOOK_WEB }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

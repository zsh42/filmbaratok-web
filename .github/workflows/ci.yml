name: CI

on:
  push:
    branches: [dev, stage, main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint  # uses package.json "lint" script — note: it applies --fix to the runner FS, which is fine in CI (no commit)
      - run: npm run type-check
